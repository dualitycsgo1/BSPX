name: BSPX regression tests

on:
  push:
    paths:
      - 'server.js'
      - 'static/js/spx_proxy_client.js'
      - 'utils/spx_atomic_json.js'
      - 'utils/spx_server_functions.js'
      - 'utils/spx_rundown.js'
      - 'utils/spx_prox*.js'
      - 'deploy/bspx.service'
      - 'deploy/install-sidecars.sh'
      - 'deploy/enable-proxy-supervision.sh'
      - 'views/view-proxies.handlebars'
      - 'routes/routes-application.js'
      - 'routes/routes-api-v1.js'
      - 'static/js/spx_gc.js'
      - 'views/view-controller.handlebars'
      - 'views/view-controllermini.handlebars'
      - 'test/*.test.cjs'
      - 'test/test_pi_sync.py'
      - 'deploy/prepare-pi-sync.py'
      - 'deploy/pi-sync-manifest.json'
      - 'static/js/eafc_fullscreen_bridge.js'
      - 'static/js/pgl_fullscreen_transitions.js'
      - 'views/view-renderer.handlebars'
      - '.github/workflows/atomic-json.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'static/js/spx_proxy_client.js'
      - 'utils/spx_atomic_json.js'
      - 'utils/spx_server_functions.js'
      - 'utils/spx_rundown.js'
      - 'utils/spx_prox*.js'
      - 'deploy/bspx.service'
      - 'deploy/install-sidecars.sh'
      - 'deploy/enable-proxy-supervision.sh'
      - 'views/view-proxies.handlebars'
      - 'routes/routes-application.js'
      - 'routes/routes-api-v1.js'
      - 'static/js/spx_gc.js'
      - 'views/view-controller.handlebars'
      - 'views/view-controllermini.handlebars'
      - 'test/*.test.cjs'
      - 'test/test_pi_sync.py'
      - 'deploy/prepare-pi-sync.py'
      - 'deploy/pi-sync-manifest.json'
      - 'static/js/eafc_fullscreen_bridge.js'
      - 'static/js/pgl_fullscreen_transitions.js'
      - 'views/view-renderer.handlebars'
      - '.github/workflows/atomic-json.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test
      - run: python -m unittest discover -s test -p test_pi_sync.py -v
      - if: runner.os == 'Linux'
        run: |
          bash -n deploy/enable-proxy-supervision.sh
          bash -n deploy/install-sidecars.sh
