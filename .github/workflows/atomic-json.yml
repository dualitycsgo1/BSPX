name: Atomic JSON regression tests

on:
  push:
    paths:
      - 'utils/spx_atomic_json.js'
      - 'utils/spx_server_functions.js'
      - 'routes/routes-application.js'
      - 'test/atomic-json.test.cjs'
      - '.github/workflows/atomic-json.yml'
  pull_request:
    paths:
      - 'utils/spx_atomic_json.js'
      - 'utils/spx_server_functions.js'
      - 'routes/routes-application.js'
      - 'test/atomic-json.test.cjs'
      - '.github/workflows/atomic-json.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/atomic-json.test.cjs
